name: Build and publish multi-arch image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: src
          load: true
          tags: faucet-claim:test
      - name: Smoke test - claim against a fake faucet page, as the Umbrel user
        run: |
          docker run --rm --user 1000:1000 --init --shm-size 256m \
            -v "$PWD:/repo:ro" -e HOME=/tmp -e APP=/app \
            faucet-claim:test sh /repo/test/smoke.sh
      - name: Image size
        run: docker image ls faucet-claim:test
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/faucet-claim:${{ steps.version.outputs.v }}
      - name: Print pinned reference for the app package
        run: echo "ghcr.io/${{ github.repository_owner }}/faucet-claim:${{ steps.version.outputs.v }}@${{ steps.build.outputs.digest }}"
